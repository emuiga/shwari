name: Build, Push and Deploy Kifwa Agents Frontend to GHCR

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  docker-deploy:
    runs-on: ubuntu-latest

    env:
      GHCR_USERNAME: sirmuchai
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate GHCR secrets
        run: |
          if [ -z "$GHCR_TOKEN" ]; then
            echo "::error::GHCR_TOKEN is missing. Add it under Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          if [ -z "${{ secrets.DOCKER_IMAGE }}" ]; then
            echo "::error::DOCKER_IMAGE secret is missing (e.g. kifwa-agents-frontend)."
            exit 1
          fi
          echo "GHCR credentials are configured for user: $GHCR_USERNAME"

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: sirmuchai
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Set image tag using commit SHA
        id: vars
        run: echo "TAG=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          TAG=${{ steps.vars.outputs.TAG }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE=ghcr.io/$OWNER/${{ secrets.DOCKER_IMAGE }}

          echo "Using GHCR image: $GHCR_IMAGE"

          IMAGE="$GHCR_IMAGE:$TAG" docker compose -f docker-compose.build.yml build
          docker tag "$GHCR_IMAGE:$TAG" "$GHCR_IMAGE:latest"

      - name: Push images to GHCR
        run: |
          TAG=${{ steps.vars.outputs.TAG }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          GHCR_IMAGE=ghcr.io/$OWNER/${{ secrets.DOCKER_IMAGE }}

          docker push "$GHCR_IMAGE:$TAG"
          docker push "$GHCR_IMAGE:latest"
